<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ITTAU1 Starter Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
            background: #f1f5f9;
        }

        header {
            padding: 55px 25px;
            text-align: center;
            color: #ffffff;
            background: #2563eb;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        header p {
            max-width: 700px;
            margin: 15px auto 0;
            font-size: 17px;
            line-height: 1.6;
        }

        main {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        section {
            padding: 30px;
            background: #ffffff;
            border: 1px solid #dce4ec;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #2563eb;
        }

        ul {
            padding-left: 22px;
            line-height: 1.9;
        }

        footer {
            padding: 20px;
            text-align: center;
            color: #64748b;
        }
    </style>
</head>

<body>
    <header>
        <h1>ITTAU1 Starter Website</h1>

        <p>
            This is the original version of the course website.
        </p>
    </header>

    <main>
        <section>
            <h2>Starter Project</h2>

            <p>
                This website will be developed on a separate Git branch.
            </p>
        </section>
    </main>

    <footer>
        <p>Starter version</p>
    </footer>
</body>
</html>
